[package]
name = "oracle"
version = "0.2.0"
description = "Local GGUF model test bench with an in-character RAG chat"
edition = "2021"
default-run = "oracle"

[lib]
name = "oracle_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "oracle"
path = "src/main.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
encoding_rs = "0.8"
minijinja = { version = "2", features = ["loop_controls"] }
minijinja-contrib = { version = "2", features = ["pycompat"] }

[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { version = "=0.1.160", default-features = false, features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
llama-cpp-2 = { version = "=0.1.160" }

# llama.cpp is unusably slow when built in debug mode; always optimize it.
[profile.dev.package.llama-cpp-sys-2]
opt-level = 3
debug = false

[profile.dev.package.llama-cpp-2]
opt-level = 3
